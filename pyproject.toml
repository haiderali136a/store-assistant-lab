[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "store-assistant-lab"
version = "0.1.0"
description = "A local experiment comparing store-assistant orchestration paths"
requires-python = ">=3.11"
dependencies = ["langgraph==1.2.16", "pydantic==2.14.1"]

[tool.setuptools.packages.find]
include = ["storelab*"]
